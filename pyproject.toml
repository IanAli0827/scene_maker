[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "scene-maker"
version = "0.1.0"
description = "Rug scene composition and rendering tool"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.2.6",
    "Pillow==11.3.0",
    "opencv-python-headless==4.12.0.88",
    "PyYAML==6.0.2",
    "python-dotenv==1.1.1",
    "replicate==1.0.7",
    "google-genai==1.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "ruff>=0.13.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
